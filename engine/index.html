<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Hour Engine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #0a1524; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%;
           display: block; }
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #b8d4ea; }
  .hud-panel { position: absolute; background: rgba(8,16,26,.72);
               border: 1px solid rgba(140,188,229,.25);
               border-radius: 8px; padding: 8px 12px; }
  .hud-panel button { pointer-events: auto; font: inherit;
                      color: #d8ecff; background: rgba(50,90,130,.5);
                      border: 1px solid rgba(140,188,229,.4);
                      border-radius: 6px; padding: 2px 10px;
                      cursor: pointer; }
  .hud-panel button:hover { background: rgba(70,120,165,.6); }
  .hud-title { left: 16px; top: 16px; letter-spacing: .14em; }
  .hud-title .stage { color: #7df3ff; }
  .hud-status { left: 16px; bottom: 16px; white-space: pre; }
  .hud-perf { right: 16px; bottom: 16px; text-align: right; }
  .hud-actions { right: 16px; top: 16px; }
  .dim { opacity: .62; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/jsm/",
    "vue": "../vendor/vue/vue.esm-browser.prod.js"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui"></div>
<script type="module" src="src/app/main.js"></script>
<script>
  setTimeout(function () {
    if (!window.__engineReady) {
      var el = document.getElementById('ui');
      if (el) el.innerHTML =
        '<div style="position:fixed;left:16px;bottom:16px;color:#ffb;' +
        'font:13px monospace">Module load stalled — serve over ' +
        'http://127.0.0.1:8765/engine/ and hard-reload</div>';
    }
  }, 12000);
</script>
</body>
</html>
